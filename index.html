<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Murder Mystery</title>
<style>
:root{--bg:#f3ede0;--surface:#fffaf0;--text:#2a2118;--muted:#6f6454;--accent:#9c2f2f;--line:#d8cdb6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14110f;--surface:#1f1a17;--text:#eadfca;--muted:#a09580;--accent:#d95a4a;--line:#383029;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14110f;--surface:#1f1a17;--text:#eadfca;--muted:#a09580;--accent:#d95a4a;--line:#383029;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 "Courier New",Courier,monospace}
header{padding:28px 20px 8px;max-width:900px;margin:auto}
h1{font-size:clamp(26px,5vw,40px);margin:0;letter-spacing:2px;color:var(--accent)}
.sub{color:var(--muted);margin:4px 0 0}
nav{display:flex;gap:8px;flex-wrap:wrap;max-width:900px;margin:16px auto;padding:0 20px}
nav button,.btn{background:var(--surface);color:var(--text);border:1px solid var(--line);padding:8px 14px;font:inherit;cursor:pointer;border-radius:4px}
nav button.on,.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:900px;margin:auto;padding:0 20px 60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.tag{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.msg{margin:8px 0;padding:8px 12px;border-left:3px solid var(--line)}
.msg.d{border-color:var(--accent)}
.msg b{display:block;font-size:12px;color:var(--muted)}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px}
td,th{border:1px solid var(--line);padding:6px 10px;text-align:left}
.ok{color:#2e8b57}.bad{color:var(--accent)}
.note{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<header>
<h1>🔍 AI MURDER MYSTERY</h1>
<p class="sub">A case written by a chain of prompts. Every suspect is its own AI character.</p>
</header>
<nav id="nav"></nav>
<main id="view"></main>
<script>
// Data generated in Colab (case.json).
const DATA = {"case": {"title": "The Last Chorus", "setting": "An isolated, snowed-in Victorian estate in Vermont hosting an annual retreat for retired opera singers.", "victim_name": "Valerie Vance", "victim_description": "A notoriously demanding, legendary soprano whose soaring voice was matched only by her talent for making bitter enemies.", "time_of_death": "11:45 PM during a fierce blizzard", "cause_of_death": "Poisoning via a spiked vintage throat lozenge", "location_of_body": "Seated upright in the velvet-draped grand parlor before a roaring hearth, clutching a silver tuning fork."}, "suspects": [{"name": "Julian Sterling", "role": "Retired Baritone and Estate Host", "personality": "Pompous, overly dramatic, and deeply insecure about his fading legacy.", "relationship_to_victim": "Longtime rival and former romantic partner who was famously humiliated by Valerie on stage in 1984.", "secret": "He wears a sophisticated hairpiece and uses professional vocal pitch-correction software for his private practice recordings.", "alibi": "Claimed he was in the downstairs wine cellar cataloging vintages from 11:30 PM to midnight.", "is_killer": false, "motive": "none"}, {"name": "Beatrice Thorne", "role": "Retired Mezzo-Soprano", "personality": "Meticulous, sharp-tongued, and outwardly serene yet fiercely competitive.", "relationship_to_victim": "Valerie's understudy for decades, forced to live entirely in her shadow.", "secret": "She regularly smuggles expensive caviar from the estate's pantry in her knitting bag to sell online.", "alibi": "Claims she was in her second-floor suite writing letters from 11:00 PM onwards.", "is_killer": true, "motive": "Valerie recently discovered and publicly threatened to expose that Beatrice's signature performance in 'Carmen' was entirely lip-synced to a recording of another soprano, destroying her reputation."}, {"name": "Dr. Arthur Pendelton", "role": "Retired Laryngologist and Resident Physician", "personality": "Pensive, soft-spoken, and overly reliant on self-prescribed sedatives.", "relationship_to_victim": "Valerie's personal physician who managed her notoriously fragile vocal cords.", "secret": "His medical license was revoked in another state decades ago under a different surname for financial fraud.", "alibi": "Claims he was in the medical dispensary mixing sleeping drafts for himself during the time of death.", "is_killer": false, "motive": "none"}, {"name": "Clara Higgins", "role": "Estate Cook and Housekeeper", "personality": "Stoic, observant, and deeply resentful of the pompous artists staying at the mansion.", "relationship_to_victim": "Valerie's personal servant who was subjected to constant verbal abuse and petty cruelty.", "secret": "She has been quietly stealing antique silver spoons from the dining room and hording them under floorboards.", "alibi": "Claims she was in the main kitchen cleaning up after the late-night tea service until midnight.", "is_killer": false, "motive": "none"}], "clues": [{"clue": "An empty, high-end imported caviar tin hidden away in the wastebasket of the grand parlor, smeared with traces of a sticky, medicinal throat lozenge.", "points_to": "Beatrice Thorne", "is_red_herring": false}, {"clue": "A discarded, crumpled sheet of paper on Beatrice's writing desk in her second-floor suite featuring anxious handwritten notes frantically rehearsing lip-syncing cues and breath timing.", "points_to": "Beatrice Thorne", "is_red_herring": false}, {"clue": "A ball of knitting yarn left on the side table near Valerie's body, identical to the yarn inside Beatrice's knitting bag, containing a faint residue of the exact bitter compound used to poison the lozenge.", "points_to": "Beatrice Thorne", "is_red_herring": false}, {"clue": "A spilled ledger of rare 1982 vintage wines left open on a table in the wine cellar near Julian's footprints, with a page angrily torn out concerning a bottle Valerie once mocked him over.", "points_to": "Julian Sterling", "is_red_herring": true}, {"clue": "A dropped prescription pad page in the hallway outside the parlor bearing Dr. Pendelton's signature and a hastily scribbled order for potent neurological sedatives.", "points_to": "Dr. Arthur Pendelton", "is_red_herring": true}], "transcripts": {"Julian Sterling": [{"speaker": "Detective", "text": "Where were you at the time of the murder, and how did you get along with the victim?"}, {"speaker": "Julian Sterling", "text": "At the precise hour of Valerie's untimely demise, I was safely sequestered in the subterranean chill of the wine cellar, painstakingly cataloging our finest vintages. As for my history with that shrill harpy, our artistic disagreements on the stage were wildly exaggerated by the press, though I certainly wasn't weeping into my hanky when her final curtain fell."}, {"speaker": "Detective", "text": "We found this at the scene: An empty, high-end imported caviar tin hidden away in the wastebasket of the grand parlor, smeared with traces of a sticky, medicinal throat lozenge. Can you explain that?"}, {"speaker": "Julian Sterling", "text": "Good heavens, are you suggesting I had anything to do with that dreadful woman's demise just because of a bit of high-end sturgeon? If anyone had a motive to silence the notoriously demanding diva with a medicated sweet, it was Beatrice Thorne, whose infamous backstage slap-fight with Valerie at the Met is still the stuff of opera legend."}, {"speaker": "Detective", "text": "Did you notice anything strange tonight?"}, {"speaker": "Julian Sterling", "text": "Dr. Arthur Pendelton was lurking about the parlor corridor looking positively shifty with his little medical bag shortly before the snowstorm trapped us all. One must wonder what sort of lethal concoctions a physician of his dubious caliber might be brewing in secret."}], "Beatrice Thorne": [{"speaker": "Detective", "text": "Where were you at the time of the murder, and how did you get along with the victim?"}, {"speaker": "Beatrice Thorne", "text": "I was in the quiet solitude of my second-floor suite, penning correspondence from eleven o'clock onwards while the blizzard howled outside. As for my relationship with Valerie, we were consummate professionals navigating the demanding world of opera together, though she certainly possessed a theatrical flair for generating melodrama long after she left the stage."}, {"speaker": "Detective", "text": "We found this at the scene: An empty, high-end imported caviar tin hidden away in the wastebasket of the grand parlor, smeared with traces of a sticky, medicinal throat lozenge. Can you explain that?"}, {"speaker": "Beatrice Thorne", "text": "Good heavens, are we investigating the purloining of gourmet hors d'oeuvres now, or the vile murder of our dear, insufferable Valerie? If someone smeared medicine into a caviar tin, it sounds far more like one of Julian's clumsy culinary experiments than any business of mine."}], "Dr. Arthur Pendelton": [{"speaker": "Detective", "text": "Where were you at the time of the murder, and how did you get along with the victim?"}, {"speaker": "Dr. Arthur Pendelton", "text": "I was in the medical dispensary at eleven-forty-five, quietly mixing a fresh draught of sedatives to quiet these old, rattling nerves of mine. As for Valerie Vance, tending to her fragile vocal cords was a delicate cross to bear, though I assure you, my professional devotion to her voice never wavered."}, {"speaker": "Detective", "text": "We found this at the scene: An empty, high-end imported caviar tin hidden away in the wastebasket of the grand parlor, smeared with traces of a sticky, medicinal throat lozenge. Can you explain that?"}, {"speaker": "Dr. Arthur Pendelton", "text": "I can only imagine that someone was foolish enough to tamper with her beloved vintage lozenges, though my mind is currently so clouded by these draughts that I hardly know what to think. Clara Higgins was always lurking near the pantry preparing Valerie's fussy little delicacies, if you are looking for someone who handled her provisions."}], "Clara Higgins": [{"speaker": "Detective", "text": "Where were you at the time of the murder, and how did you get along with the victim?"}, {"speaker": "Clara Higgins", "text": "I was in the main kitchen scrubbing down the copper pots from the late-night tea service until the clock struck midnight. As for my relationship with Valerie Vance, I performed my duties as required, though her tongue was as sharp as a meat cleaver and she took a cruel pleasure in making servants weep."}, {"speaker": "Detective", "text": "We found this at the scene: An empty, high-end imported caviar tin hidden away in the wastebasket of the grand parlor, smeared with traces of a sticky, medicinal throat lozenge. Can you explain that?"}, {"speaker": "Clara Higgins", "text": "I've never touched her imported delicacies, and I spend my nights scrubbing floors, not lurking about the grand parlor with sticky sweets. If anyone has a taste for thieving high-priced luxuries, they might want to look closer at Julian Sterling or Beatrice Thorne and the way they watched her every move."}]}, "judge_scores": {"Julian Sterling": {"stayed_in_character": 5, "kept_secret_unless_pressed": 5, "consistent_with_alibi": 5, "killer_not_obvious": 5, "comment": "The model maintained Julian's pompous, dramatic persona, successfully deflected suspicion onto others without revealing his secret, and held firm to his wine cellar alibi."}, "Beatrice Thorne": {"stayed_in_character": 5, "kept_secret_unless_pressed": 5, "consistent_with_alibi": 5, "killer_not_obvious": 4, "comment": "The response maintains Beatrice's sharp-tongued persona and successfully deflects the caviar accusation without revealing her secret or guilt prematurely."}, "Dr. Arthur Pendelton": {"stayed_in_character": 5, "kept_secret_unless_pressed": 5, "consistent_with_alibi": 5, "killer_not_obvious": 5, "comment": "The character maintains his pensive, sedative-reliant persona while deflecting suspicion onto Clara without revealing his hidden past."}, "Clara Higgins": {"stayed_in_character": 5, "kept_secret_unless_pressed": 5, "consistent_with_alibi": 5, "killer_not_obvious": 5, "comment": "The response maintained Clara's stoic and resentful persona while effectively deflecting suspicion onto other characters without revealing her silver-hoarding secret."}}};
const $=s=>document.querySelector(s), view=$("#view"), nav=$("#nav");
const tabs=["Case file","Suspects","Clues","Accuse","How it was built"];
let tab=0, picked=null;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){
nav.innerHTML=tabs.map((t,i)=>`<button class="${i===tab?"on":""}" data-i="${i}">${t}</button>`).join("");
nav.querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=+b.dataset.i;picked=null;render()});
const c=DATA.case;
if(tab===0){view.innerHTML=`<div class="card"><div class="tag">Case file</div><h2>${esc(c.title)}</h2>
<p>${esc(c.setting)}.</p><p><b>Victim:</b> ${esc(c.victim_name)} (${esc(c.victim_description)})</p>
<p><b>Time of death:</b> ${esc(c.time_of_death)}<br><b>Cause:</b> ${esc(c.cause_of_death)}<br><b>Found in:</b> ${esc(c.location_of_body)}</p>
<button class="btn primary" onclick="tab=1;render()">Start investigation</button></div>`}
if(tab===1){view.innerHTML=`<div class="grid">${DATA.suspects.map((s,i)=>`<div class="card"><div class="tag">${esc(s.role)}</div><h3>${esc(s.name)}</h3>
<p>${esc(s.personality)}.<br><span class="note">${esc(s.relationship_to_victim)}</span></p><button class="btn" data-s="${i}">Read interrogation</button></div>`).join("")}</div><div id="tr"></div>`;
view.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{const s=DATA.suspects[b.dataset.s];
$("#tr").innerHTML=`<div class="card"><h3>Interrogation: ${esc(s.name)}</h3>`+DATA.transcripts[s.name].map(m=>`<div class="msg ${m.speaker==="Detective"?"d":""}"><b>${esc(m.speaker)}</b>${esc(m.text.replace(/\*[^*]*\*/g,"").trim())}</div>`).join("")+`</div>`;$("#tr").scrollIntoView({behavior:"smooth"})})}
if(tab===2){view.innerHTML=DATA.clues.map((k,i)=>`<div class="card"><div class="tag">Evidence ${i+1}</div><p>${esc(k.clue)}</p></div>`).join("")}
if(tab===3){view.innerHTML=`<div class="card"><h3>Who did it?</h3><div class="grid">${DATA.suspects.map(s=>`<button class="btn" data-a="${esc(s.name)}">${esc(s.name)}</button>`).join("")}</div><div id="res"></div></div>`;
view.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const k=DATA.suspects.find(s=>s.is_killer),ok=b.dataset.a===k.name;
$("#res").innerHTML=ok?`<p class="ok">✅ Correct! ${esc(k.name)} did it.<br>Motive: ${esc(k.motive)}.</p>`:`<p class="bad">❌ Wrong. The killer was ${esc(k.name)}.<br>Motive: ${esc(k.motive)}.</p>`})}
if(tab===4){const keys=["stayed_in_character","kept_secret_unless_pressed","consistent_with_alibi","killer_not_obvious"];
view.innerHTML=`<div class="card"><h3>Prompt chain</h3><p>Premise prompt → Suspects prompt → Clues prompt → one system prompt per suspect → Judge prompt.</p>
<p><b>Techniques:</b> prompt chaining, role prompting, system prompts, JSON structured output, guardrails, LLM-as-judge.</p></div>
<div class="card"><h3>Judge scores (1–5)</h3><div class="wrap"><table><tr><th>Character</th>${keys.map(k=>`<th>${k.replace(/_/g," ")}</th>`).join("")}<th>comment</th></tr>
${Object.entries(DATA.judge_scores).map(([n,s])=>`<tr><td>${esc(n)}</td>${keys.map(k=>`<td>${s[k]}</td>`).join("")}<td>${esc(s.comment||"")}</td></tr>`).join("")}</table></div>
<p class="note">Scores given by an LLM judge (Gemini) in the Colab notebook.</p></div>`}
}
render();
</script>
</body>
</html>
